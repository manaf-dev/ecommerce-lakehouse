name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test (gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Tests (unit + integration, ≥80 % coverage)
        run: pytest tests/ -v --cov=src --cov-fail-under=80

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Build utils.zip
        run: make build-utils-zip

      - name: Verify utils.zip structure
        run: make verify-zip

      - name: Upload utils.zip (if lakehouse bucket exists)
        run: |
          if aws s3api head-bucket --bucket "${{ vars.LAKEHOUSE_BUCKET }}" 2>/dev/null; then
            aws s3 cp dist/utils.zip "s3://${{ vars.LAKEHOUSE_BUCKET }}/scripts/utils.zip"
          else
            echo "Lakehouse bucket not found — skipping pre-apply upload (apply creates the bucket)."
          fi

      - name: Terraform init
        run: >-
          terraform -chdir=terraform/main init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        run: >-
          terraform -chdir=terraform/main plan -input=false -out=tfplan
          -var="project=${{ vars.TF_PROJECT }}"
          -var="bucket=${{ vars.LAKEHOUSE_BUCKET }}"
          -var="region=${{ vars.AWS_REGION }}"
          -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: Terraform apply
        run: terraform -chdir=terraform/main apply -input=false tfplan

      - name: Upload utils.zip to lakehouse bucket
        run: >-
          aws s3 cp dist/utils.zip
          s3://${{ vars.LAKEHOUSE_BUCKET }}/scripts/utils.zip
