name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test (gate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Tests (unit + integration, ≥80 % coverage)
        run: pytest tests/ -v --cov=src --cov-fail-under=80

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: test

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Build utils.zip
        run: make build-utils-zip

      - name: Verify utils.zip structure
        run: make verify-zip

      - name: Upload utils.zip (before Terraform plan)
        run: >-
          aws s3 cp dist/utils.zip
          s3://${{ vars.LAKEHOUSE_BUCKET }}/scripts/utils.zip

      - name: Terraform init
        run: >-
          terraform -chdir=terraform/main init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        run: >-
          terraform -chdir=terraform/main plan -input=false -out=tfplan
          -var="project=${{ vars.TF_PROJECT }}"
          -var="bucket=${{ vars.LAKEHOUSE_BUCKET }}"
          -var="region=${{ vars.AWS_REGION }}"
          -var="alert_email=${{ secrets.ALERT_EMAIL }}"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/main/tfplan
          if-no-files-found: error

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: plan
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/main

      - name: Terraform init
        run: >-
          terraform -chdir=terraform/main init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        run: terraform -chdir=terraform/main apply -input=false tfplan

      - name: Deploy Athena views
        run: |
          WORKGROUP="${{ vars.TF_PROJECT }}-workgroup"
          RESULTS="s3://${{ vars.LAKEHOUSE_BUCKET }}/athena-results/"
          REGION="${{ vars.AWS_REGION }}"

          for sql_file in sql/views/*.sql; do
            view_name=$(basename "$sql_file" .sql)
            echo "Creating view: $view_name"

            EXEC_ID=$(aws athena start-query-execution \
              --query-string "$(cat "$sql_file")" \
              --work-group "$WORKGROUP" \
              --query-execution-context Database=lakehouse_dwh \
              --result-configuration OutputLocation="$RESULTS" \
              --region "$REGION" \
              --query QueryExecutionId --output text)

            echo "  Query ID: $EXEC_ID"

            for i in $(seq 1 12); do
              sleep 5
              STATE=$(aws athena get-query-execution \
                --query-execution-id "$EXEC_ID" \
                --region "$REGION" \
                --query 'QueryExecution.Status.State' --output text)
              echo "  State: $STATE"
              if [ "$STATE" = "SUCCEEDED" ]; then break; fi
              if [ "$STATE" = "FAILED" ] || [ "$STATE" = "CANCELLED" ]; then
                REASON=$(aws athena get-query-execution \
                  --query-execution-id "$EXEC_ID" \
                  --region "$REGION" \
                  --query 'QueryExecution.Status.StateChangeReason' --output text)
                echo "  Error: $REASON"
                exit 1
              fi
            done

            if [ "$STATE" != "SUCCEEDED" ]; then
              echo "  Timed out waiting for $view_name"
              exit 1
            fi
          done
          echo "All Athena views deployed successfully."
