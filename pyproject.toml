[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-lakehouse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[all]>=5",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "delta-spark==3.2.0",
    "pyspark==3.5.1",
    "mypy>=1.10",
    "ruff>=0.4.0",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["utils*", "glue_jobs*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
# N812: `functions as F` is idiomatic PySpark; suppressing globally.
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["src/glue_jobs/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
